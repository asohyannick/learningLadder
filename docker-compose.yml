name: learning-ladder

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: learning-ladder-api:latest
    container_name: learning-ladder-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PG_DATABASE_HOST: ${DOCKER_PG_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-8070}:${PORT:-8070}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - learning-ladder-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: learning-ladder-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning-ladder-net

networks:
  learning-ladder-net:
    driver: bridge

volumes:
  redis_data: