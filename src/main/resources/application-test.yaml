      port: ${MINIO_PORT:9000}
      use-ssl: ${MINIO_USE_SSL:false}
      region: ${MINIO_REGION:us-east-1}
      username: ${MINIO_USERNAME:test-access-key}
      password: ${MINIO_PASSWORD:test-secret-key}
      bucket-name: ${MINIO_BUCKET_NAME:test-bucket}
