spring:
  threads:
    virtual:
      enabled: true
  application:
    name: learningLadder

  datasource:
    url: jdbc:postgresql://localhost:5432/learningLadder
    username: ${PG_DATABASE_USERNAME:postgres}
    password: ${PG_DATABASE_PASSWORD:Engineer200!!!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true

  cache:
    type: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${PORT:8050}
  forward-headers-strategy: framework

app:
  api:
    version: ${API_VERSION:v1}

  security:
    jwt:
      access-token: ${JWT_ACCESS_TOKEN:Y2ktdGVzdC1hY2Nlc3MtdG9rZW4tc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi11c2UtMDEyMzQ1Njc4OUFC}
      refresh-token: ${JWT_REFRESH_TOKEN:Y2ktdGVzdC1yZWZyZXNoLXRva2VuLXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTAxMjM0NTY3ODlBQg==}
