# Learning Ladder - CI/CD pipeline
#
#   Pull request / push to develop  ->  build + test only (CI)
#   Push to master                  ->  build + test -> Docker image -> staging -> (approval) -> production
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
#   PROD_HOST,    PROD_USER,    PROD_SSH_KEY
# Required GitHub environments (Settings > Environments): "staging" and "production"
#   -> add yourself as "Required reviewer" on "production" so prod deploys wait for your click.

name: CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch: {}            # "Run workflow" button in the Actions tab

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true         # a newer push cancels the older run on the same branch

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ------------------------------------------------------------------ 1. CI
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throw-away Postgres + Redis, only for this job. Flyway runs all migrations against it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: learningladder_test
          POSTGRES_USER: ll_test
          POSTGRES_PASSWORD: ll_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ll_test -d learningladder_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test
      # SPRING_* variables override application*.yaml directly (relaxed binding).
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/learningladder_test
      SPRING_DATASOURCE_USERNAME: ll_test
      SPRING_DATASOURCE_PASSWORD: ll_test_password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ""
      # Every other ${PLACEHOLDER} used in application.yaml / application-test.yaml needs a value here,
      # otherwise the Spring context fails to start. Copy the keys from env.example and use FAKE test
      # values - never real keys. Examples (rename to match your env.example):
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-64-characters-long-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile, run tests, package
        # verify = compile (incl. MapStruct with unmappedTargetPolicy=ERROR) + unit tests
        #          + integration tests + jar. Any failure stops the pipeline here.
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ------------------------------------------------------------------ 2. Docker image
  docker-image:
    name: Build & push Docker image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # push to GitHub Container Registry (ghcr.io)
    outputs:
      image-tag: ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the jar built in CI
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Image tag = short commit SHA
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase, required by Docker)
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.vars.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ 3. Staging
  deploy-staging:
    name: Deploy to staging
    needs: docker-image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.learningladder.example     # change to your staging URL
    steps:
      - name: Pull new image and restart on the staging server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.docker-image.outputs.image-tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/learningladder
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app
            docker image prune -f
            # Wait until Spring Boot (and Flyway) is up
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8050/actuator/health | grep -q '"UP"'; then
                echo "Staging is healthy on $IMAGE_TAG"; exit 0
              fi
              sleep 5
            done
            echo "Staging did not become healthy"; docker compose -f docker-compose.prod.yml logs --tail=200 app; exit 1

  # ------------------------------------------------------------------ 4. Production
  deploy-production:
    name: Deploy to production
    needs: [docker-image, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production               # waits here for a required reviewer to click "Approve"
      url: https://api.learningladder.example
    steps:
      - name: Pull new image and restart on the production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.docker-image.outputs.image-tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/learningladder
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # remember the running version so we can roll back
            PREVIOUS_TAG=$(cat .current_tag 2>/dev/null || echo latest)
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8050/actuator/health | grep -q '"UP"'; then
                echo "$IMAGE_TAG" > .current_tag
                docker image prune -f
                echo "Production is healthy on $IMAGE_TAG"; exit 0
              fi
              sleep 5
            done
            echo "Unhealthy - rolling back to $PREVIOUS_TAG"
            IMAGE_TAG=$PREVIOUS_TAG docker compose -f docker-compose.prod.yml up -d app
            exit 1